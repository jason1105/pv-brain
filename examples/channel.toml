schema_version = 1

[channel]
id = "tech-explains"
name = "Tech Explains"
niche = "consumer tech explainers"
audience = "curious non-experts, 18-40"
language = "en"

[content]
tone = "curious, punchy, no hype"
video_minutes_target = 5
style = "dark"                     # dark | light | bold

[render]
resolution = "1920x1080"
fps = 30
# font_path = "/path/to/NotoSansCJK.otf"   # required for CJK languages

[providers]
# Real content providers (used when running WITHOUT --offline):
llm = "anthropic"                  # anthropic | ark (Volcengine/Doubao) | gemini
llm_model = "claude-sonnet-5"      # ark: your endpoint/model id; gemini: e.g. gemini-2.5-flash
tts = "edge"                       # edge (real speech, keyless) | tone | silence
tts_voice = "en-US-GuyNeural"
# API keys come from env vars only: ANTHROPIC_API_KEY / ARK_API_KEY / GEMINI_API_KEY.
# With --offline, the mock LLM + tone TTS are used regardless and output is a DRAFT.
